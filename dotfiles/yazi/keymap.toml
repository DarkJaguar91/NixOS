[[mgr.prepend_keymap]]
on = "b"
run = "shell -- noctalia msg wallpaper-set %h"
desc = "Set hovered image as Noctalia wallpaper"

# Quick jumps, alongside the default g h / g c / g d
[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/.config/NixOS"
desc = "Go to NixOS config"

[[mgr.prepend_keymap]]
on = ["g", "P"]
run = "cd ~/Proj"
desc = "Go to ~/Proj"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "cd ~/Pictures"
desc = "Go to ~/Pictures"

[[mgr.prepend_keymap]]
on = ["g", "w"]
run = "cd ~/Pictures/Wallpapers"
desc = "Go to wallpapers"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = "cd ~/Videos"
desc = "Go to ~/Videos"
