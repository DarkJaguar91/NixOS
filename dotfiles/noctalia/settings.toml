config_version = 16

[audio]
enable_overdrive = true

[bar.default]
center = [ "workspaces", "audio_visualizer", "weather" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_ends = 0
start = [ "control-center", "clock", "group:g1", "media" ]

    [bar.default.monitor.xr-glasses]
    enabled = false
    match = "VITURE"

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "wallpaper", "mpvpaper", "launcher_2" ]
    opacity = 0.20000000298023224
    padding = 6.0

[calendar]
enabled = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

