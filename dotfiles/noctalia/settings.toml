config_version = 7

[audio]
enable_overdrive = true

[bar.default]
center = [ "workspaces", "weather" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
margin_ends = 0
start = [ "control-center", "clock", "group:g1", "media" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "wallpaper", "mpvpaper", "launcher_2" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1024.0
    cy = 1161.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[plugin_settings."alexander/game-launcher"]
browser_placement = "attached"
steampoacher_enabled = true

[plugin_settings."noctalia/mpvpaper"]
video_directory = "~/Videos/Wallpapers"

[plugins]
enabled = [ "noctalia/screen_recorder", "noctalia/mpvpaper", "alexander/game-launcher" ]

[shell.panel]
launcher_placement = "attached"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "neovim", "bat", "discord", "steam" ]

[wallpaper]
directory = "/home/brandon/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/brandon/Pictures/Wallpapers/2014-new-year-blue-abstract-horse-wallpaper-24a9f393695539aba6a8e7101b82d97d.jpg"

    [wallpaper.last]
    path = "/home/brandon/.cache/noctalia/mpvpaper/_home_brandon_Videos_Wallpapers_cozy_bedroom_at_night_3840x2160_mp4.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/brandon/.cache/noctalia/mpvpaper/_home_brandon_Videos_Wallpapers_cozy_bedroom_at_night_3840x2160_mp4.jpg"

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.workspaces]
hide_when_empty = true
style = "focus_hint"