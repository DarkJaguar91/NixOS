[plugin_settings."alexander/game-launcher"]
browser_placement = "attached"
steampoacher_enabled = true

[plugin_settings."h465855hgg/lyrics"]
player_allowlist = [ "spotify" ]
translation_language = "en"

[plugin_settings."noctalia/mpvpaper"]
auto_pause = "off"
mpv_options = "vf=fps=30"
video_directory = "~/Videos/Wallpapers"

[plugins]
enabled = [ "noctalia/screen_recorder", "alexander/game-launcher", "noctalia/mpvpaper" ]

[shell]
font_family = "Ubuntu Nerd Font"

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    launcher_placement = "attached"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt", "umbriel" ]
    community_ids = [ "claude-code", "opencode", "discord", "neovim", "steam", "bat", "fzf", "yazi" ]

[wallpaper]
directory = "/home/brandon/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/brandon/Pictures/Wallpapers/Lofi-Cafe1.png"

    [wallpaper.last]
    path = "/home/brandon/Pictures/Wallpapers/Lofi-Cafe1.png"

    [wallpaper.monitors.DP-1]
    path = "/home/brandon/Pictures/Wallpapers/Lofi-Cafe1.png"

    [wallpaper.monitors.DP-2]
    path = "/home/brandon/Pictures/Wallpapers/Arch-chan_to.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/brandon/Pictures/Wallpapers/Lofi-Cafe1.png"

    [wallpaper.monitors.xr]
    path = "/home/brandon/Pictures/Wallpapers/Arch-chan_to.png"

    [wallpaper.monitors.xr-left]
    path = "/home/brandon/.cache/noctalia/mpvpaper/_home_brandon_Videos_Wallpapers_red_eyes_anime_girl_4k_wallsflow_com_mp4.jpg"

    [wallpaper.monitors.xr-right]
    path = "/home/brandon/.cache/noctalia/mpvpaper/_home_brandon_Videos_Wallpapers_red_eyes_anime_girl_4k_wallsflow_com_mp4.jpg"

    [wallpaper.monitors.xr-top]
    path = "/home/brandon/.cache/noctalia/mpvpaper/_home_brandon_Videos_Wallpapers_red_eyes_anime_girl_4k_wallsflow_com_mp4.jpg"

    [wallpaper.monitors."xr.1.0"]
    path = "/home/brandon/Pictures/Wallpapers/Arch-chan_to.png"

[widget.audio_visualizer]
bands = 32
color_1 = "on_primary"
interactive = false
width = 100

[widget.launcher_2]
type = "alexander/game-launcher:launcher"

[widget.media]
hide_when_no_media = true

[widget.mpvpaper]
type = "noctalia/mpvpaper:mpvpaper"

[widget.workspaces]
hide_when_empty = true
style = "focus_hint"