# Genshin Impact: subtle "fake HDR" pop + richer colour, then sharpen away
# TAA blur. Applies to the whole frame, UI and text included.
#
# Launch with:
#   ENABLE_VKBASALT=1 VKBASALT_CONFIG_FILE=/home/brandon/.config/vkBasalt/games/genshin.conf
# Home toggles the effect for before/after comparison.

# Grade first, sharpen last: running CAS before FakeHDR would let FakeHDR's
# local contrast boost amplify the sharpening halos.
effects = fakehdr:tonemap:vibrance:cas

toggleKey = Home
enableOnLaunch = True

reshadeTexturePath = /home/brandon/.local/share/reshade/Textures
reshadeIncludePath = /home/brandon/.local/share/reshade/Shaders

# Effect names are lowercase on purpose: a ReShade shader's uniforms are set
# by name from this file too, and Vibrance.fx has a uniform called
# "Vibrance" that would otherwise collide with the effect's path.
fakehdr  = /home/brandon/.local/share/reshade/Shaders/FakeHDR.fx
tonemap  = /home/brandon/.local/share/reshade/Shaders/Tonemap.fx
vibrance = /home/brandon/.local/share/reshade/Shaders/Vibrance.fx

# FakeHDR (shader defaults: 1.30 / 0.793 / 0.87). The default power crushes
# Genshin's already-contrasty shadows and darkens the image, so go gentler.
HDRPower = 1.10
radius1 = 0.793
radius2 = 0.87

# Tonemap: Gamma < 1.0 lifts midtones, offsetting FakeHDR's darkening.
Gamma = 0.97
Exposure = 0.0
Saturation = 0.0
Bleach = 0.0
Defog = 0.0

# Vibrance boosts muted colours more than already-saturated ones, so it
# won't blow out Genshin's bright palette like plain saturation would.
Vibrance = 0.20

# CAS: 0.0-1.0
casSharpness = 0.4
