# Example per-game config: copy to games/<game>.conf and point the game's
# Steam launch options at it via VKBASALT_CONFIG_FILE.

effects = cas:smaa
toggleKey = Home
enableOnLaunch = True

casSharpness = 0.6

smaaEdgeDetection = luma
smaaThreshold = 0.05
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16
smaaCornerRounding = 25
