[[window_rule]]
match.app_id = "^firefox$"
default_workspace = 2

[[window_rule]]
match.app_id = "^[Ss]team$"
match.title = "^Steam$"
default_workspace = 3

[[window_rule]]
match.app_id = "^[Ss]team$"
match.title = "[Hh][Oo][Yy][Oo][Pp][Ll][Aa][Yy]"
default_floating = true

[[window_rule]]
match.app_id = "^[Ss]team$"
match.title = "^(Properties|Settings|Configure)"
default_floating = true

[[window_rule]]
match.app_id = "^[Ss]team$"
match.title = "^[Ff]riends"
default_floating = true

[[window_rule]]
match.app_id = "^steam_app_"
default_fullscreen = true
default_workspace = 3

[[window_rule]]
match.app_id = "^steam_app_"
match.title = "^HoYoPlay$"
default_floating = true
default_fullscreen = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Steam notification toasts: corner, on top, never steal focus
[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true
