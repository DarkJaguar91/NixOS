[colors]
background = "#1f1f24FF"
text_primary = "#e4e1e8FF"
text_muted = "#c6c5d2FF"
accent_primary = "#bcc2ffFF"
accent_secondary = "#c2c4e7FF"
warning = "#fbadedFF"
error = "#ffb4abFF"
insert_hint = "#fbaded80"
backdrop = "#464650FF"

[colors.border]
focused = "#bcc2ffFF"
unfocused = "#464650FF"
outer = "#131318FF"

[colors.overview]
background_tint = "#13131888"
badge = "#bcc2ffFF"
workspace_background = "#131318FF"

[colors.tab_bar]
background = "#1f1f24FF"
text = "#c6c5d2FF"
active = "#bcc2ffFF"
active_text = "#1f286fFF"
active_unfocused = "#464650FF"
active_unfocused_text = "#e4e1e8FF"
urgent = "#ffb4abFF"
urgent_text = "#690005FF"

[colors.title_bar]
background = "#1f1f24FF"
background_unfocused = "#131318FF"
text = "#e4e1e8FF"
text_unfocused = "#c6c5d2FF"
close = "#ffb4abFF"
maximize = "#bcc2ffFF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#fbadedFF"
border_color_unfocused = "#84447cFF"
