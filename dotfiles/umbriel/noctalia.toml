[colors]
background = "#1f1f22FF"
text_primary = "#e4e1e5FF"
text_muted = "#c7c5cfFF"
accent_primary = "#bec4f0FF"
accent_secondary = "#c4c5d8FF"
warning = "#eab8d8FF"
error = "#ffb4abFF"
insert_hint = "#eab8d880"
backdrop = "#46464eFF"

[colors.border]
focused = "#bec4f0FF"
unfocused = "#46464eFF"
outer = "#131316FF"

[colors.overview]
background_tint = "#13131688"
badge = "#bec4f0FF"
workspace_background = "#131316FF"

[colors.tab_bar]
background = "#1f1f22FF"
text = "#c7c5cfFF"
active = "#bec4f0FF"
active_text = "#282e51FF"
active_unfocused = "#46464eFF"
active_unfocused_text = "#e4e1e5FF"
urgent = "#ffb4abFF"
urgent_text = "#690005FF"

[colors.title_bar]
background = "#1f1f22FF"
background_unfocused = "#131316FF"
text = "#e4e1e5FF"
text_unfocused = "#c7c5cfFF"
close = "#ffb4abFF"
maximize = "#bec4f0FF"
minimize = "#c4c5d8FF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#eab8d8FF"
border_color_unfocused = "#78506cFF"
