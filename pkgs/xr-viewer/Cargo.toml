[package]
name = "xr-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "default_fonts"] }
glam = "0.34.1"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
